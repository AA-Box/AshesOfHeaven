[DevOptions.Shaders]
; Required for converting validated DX12 recordings into a stable PCD3D_SM6 cache.
NeedsShaderStableKeys=True

[SystemSettings]
; Keep a collected cache lean by excluding PSOs already covered by automatic precaching.
; Lightweight validation is enabled in DefaultEngine.ini, satisfying this option's requirement.
r.ShaderPipelineCache.ExcludePrecachePSO=1
