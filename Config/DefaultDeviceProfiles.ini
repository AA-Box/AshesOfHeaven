; Shared device profiles. The runtime platform manager selects gameplay budgets;
; these profiles select renderer fallbacks before a level begins.

[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=
+CVars=r.Nanite.ProjectEnabled=1
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.DynamicGlobalIlluminationMethod=1
+CVars=r.ReflectionMethod=1
+CVars=r.DynamicRes.OperationMode=2
; VSM clipmap range. The default 6..22 spans 128 levels of virtual page marking per view, and the
; opening spawns hundreds of small non-Nanite meshes over that area, which overflows the
; per-group marking job queue ("Non-Nanite Marking Job Queue overflow" on screen in Development).
; 9..16 keeps the shadow range the scene actually uses - the finest levels only matter within a
; couple of metres of the camera - and costs nothing in look beyond slightly softer contact
; shadows under debris. This is the only fix here that touches no asset and no geometry.
+CVars=r.Shadow.Virtual.Clipmap.FirstLevel=9
+CVars=r.Shadow.Virtual.Clipmap.LastLevel=16

[Mac DeviceProfile]
DeviceType=Mac
BaseProfileName=
+CVars=r.Nanite.ProjectEnabled=1
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.DynamicGlobalIlluminationMethod=1
+CVars=r.ReflectionMethod=1
+CVars=r.RayTracing=0
+CVars=r.DynamicRes.OperationMode=2
; VSM clipmap range. The default 6..22 spans 128 levels of virtual page marking per view, and the
; opening spawns hundreds of small non-Nanite meshes over that area, which overflows the
; per-group marking job queue ("Non-Nanite Marking Job Queue overflow" on screen in Development).
; 9..16 keeps the shadow range the scene actually uses - the finest levels only matter within a
; couple of metres of the camera - and costs nothing in look beyond slightly softer contact
; shadows under debris. This is the only fix here that touches no asset and no geometry.
+CVars=r.Shadow.Virtual.Clipmap.FirstLevel=9
+CVars=r.Shadow.Virtual.Clipmap.LastLevel=16

[Android DeviceProfile]
