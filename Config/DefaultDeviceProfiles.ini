+CVars=r.RayTracing=0
+CVars=r.MobileHDR=1
+CVars=r.DynamicRes.OperationMode=2
+CVars=r.Shadow.MaxResolution=1024
+CVars=r.MobileContentScaleFactor=0.75

[Android_Low DeviceProfile]
