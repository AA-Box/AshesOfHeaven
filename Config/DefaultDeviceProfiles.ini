; Shared device profiles. The runtime platform manager selects gameplay budgets;
; these profiles select renderer fallbacks before a level begins.

[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=
+CVars=r.Nanite.ProjectEnabled=1
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.DynamicGlobalIlluminationMethod=1
+CVars=r.ReflectionMethod=1
+CVars=r.DynamicRes.OperationMode=2

[Mac DeviceProfile]
DeviceType=Mac
BaseProfileName=
+CVars=r.Nanite.ProjectEnabled=1
+CVars=r.Shadow.Virtual.Enable=1
+CVars=r.DynamicGlobalIlluminationMethod=1
+CVars=r.ReflectionMethod=1
+CVars=r.DynamicRes.OperationMode=2

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.Nanite.ProjectEnabled=0
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.DynamicGlobalIlluminationMethod=0
+CVars=r.ReflectionMethod=0
+CVars=r.RayTracing=0
+CVars=r.MobileHDR=1
+CVars=r.DynamicRes.OperationMode=2
+CVars=r.Shadow.MaxResolution=1024
+CVars=r.MobileContentScaleFactor=0.75

[Android_Low DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.MobileContentScaleFactor=0.60
+CVars=r.Shadow.MaxResolution=512
+CVars=r.Mobile.AllowDistanceFieldShadows=0
+CVars=r.Mobile.EnableMovableLightCSMShaderCulling=1

[Android_High DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.MobileContentScaleFactor=0.90
+CVars=r.Shadow.MaxResolution=1536

