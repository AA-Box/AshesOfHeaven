+DirectoriesToAlwaysCook=(Path="/Game/Ashes")
; DirectoriesToAlwaysCook does not pick up .umap packages: the authored Erebus
; presentation level must be listed explicitly or packaged LoadLevelInstance fails
; validation and the director falls back to the legacy primitive build.
+MapsToCook=(FilePath="/Game/Ashes/Environment/Erebus/L_ErebusOpening_Presentation")
; Volumetric cloud deck is spawned at runtime, so the cooker never sees a hard reference
; to the engine default cloud material. Cook it explicitly.
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")
; Native code loads the M91 and template projectile classes by soft path.
; The legacy body presentation (AAHCombatantCharacter::RequestLegacyPresentationAsync, used by
; friendlies and by any combatant without an enemy definition) resolves SKM_Manny_Simple from a
; hard-coded path in C++, which the cooker cannot see as a reference. Without this the mesh is
; never cooked, LoadObject returns null in the packaged build, and every body on that path is
; invisible - enemies only render because DA_Enemy_* pulls in SKM_Quinn_Simple as a real reference.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins")
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/Rifle")
+DirectoriesToAlwaysCook=(Path="/Game/Variant_Shooter/Blueprints/Pickups/Projectiles")

