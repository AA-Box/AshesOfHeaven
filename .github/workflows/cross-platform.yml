name: Cross-platform validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Every job only reads the repository: checkout needs contents:read, and
# actions/upload-artifact uses the Actions runtime token rather than GITHUB_TOKEN.
# Jobs inherit this, so no job needs its own block.
permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared source/configuration
        run: ./Scripts/Validate-CrossPlatform.sh

  # The merge gate for gameplay contracts. Every AshesOfHeaven.* automation test is
  # EditorContext|CommandletContext, so only an editor/commandlet run executes them.
  automation-tests:
    if: ${{ vars.UNREAL_ENGINE_MAC_ROOT != '' }}
    runs-on: [self-hosted, macOS, UE5]
    # Without a timeout an unregistered self-hosted runner leaves the job queued rather than
    # failing, which reads as "still running" instead of "the gate is not configured".
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run Unreal automation suite
        env:
          UE_ROOT: ${{ vars.UNREAL_ENGINE_MAC_ROOT }}
        run: ./Scripts/Run-AutomationTests.sh
      - name: Upload automation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: |
            Saved/AutomationReport
            Saved/Logs/AutomationRun.log
          if-no-files-found: warn

  windows-shipping:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.UNREAL_ENGINE_WINDOWS_ROOT != '' }}
    runs-on: [self-hosted, Windows, UE5]
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows Shipping archive
        shell: pwsh
        env:
          UE_ROOT: ${{ vars.UNREAL_ENGINE_WINDOWS_ROOT }}
        run: ./Scripts/Build-Windows.ps1

  macos-shipping:
    if: ${{ vars.UNREAL_ENGINE_MAC_ROOT != '' }}
    runs-on: [self-hosted, macOS, UE5]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS Shipping archive
        env:
          UE_ROOT: ${{ vars.UNREAL_ENGINE_MAC_ROOT }}
        run: ./Scripts/Build-Mac.sh

  android-shipping:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.UNREAL_ENGINE_ANDROID_ROOT != '' }}
    runs-on: [self-hosted, macOS, UE5, Android]
    steps:
      - uses: actions/checkout@v4
      - name: Build Android ARM64 test package
        env:
          UE_ROOT: ${{ vars.UNREAL_ENGINE_ANDROID_ROOT }}
        run: ./Scripts/Build-Android.sh

  ios-shipping:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.UNREAL_ENGINE_IOS_ROOT != '' }}
    runs-on: [self-hosted, macOS, UE5, iOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS/iPadOS package
        env:
          UE_ROOT: ${{ vars.UNREAL_ENGINE_IOS_ROOT }}
          AH_IOS_DISTRIBUTION: "0"
        run: ./Scripts/Build-iOS.sh

  # The packaged campaign lifecycle: package -> play -> complete -> quit -> relaunch -> still
  # complete. Not in required-checks: it packages a full Development build and launches the
  # game twice, which is too heavy for every pull request. Run it before a release, or when
  # anything touches save, checkpoint or chapter-completion code.
  packaged-level-one-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.UNREAL_ENGINE_MAC_ROOT != '' }}
    runs-on: [self-hosted, macOS, UE5]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Packaged Level One end-to-end
        env:
          UE_ROOT: ${{ vars.UNREAL_ENGINE_MAC_ROOT }}
        run: ./Scripts/Run-LevelOneE2E.sh
      - name: Upload playthrough logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-one-e2e-logs
          path: Saved/Logs/LevelOneE2E-*.log
          if-no-files-found: warn

  # THE required check. Mark exactly this job as required in branch protection.
  #
  # automation-tests and macos-shipping are gated on vars.UNREAL_ENGINE_MAC_ROOT and are
  # SKIPPED whenever no self-hosted UE5/macOS runner is configured. This repository is public,
  # and a self-hosted runner on a public repository executes fork-authored code on the machine
  # it is registered to, so running one is a real risk rather than an oversight - and a laptop
  # that is not always online would turn every gated job into a timeout instead of a result.
  #
  # So a skip is tolerated here, and the claim it would have made is checked a different way:
  # source-validation (hosted, always runs) verifies Docs/automation-evidence.json against a
  # hash of Source, Config, Content, Scripts and the .uproject. Edit gameplay code without
  # re-running the suite and that check fails. What is NOT tolerated is a gated job that ran
  # and failed, or a skipped job whose absence is not covered by evidence.
  required-checks:
    if: always()
    needs: [source-validation, automation-tests, macos-shipping]
    runs-on: ubuntu-latest
    steps:
      - name: Assert the merge gate actually reached a verdict
        env:
          SOURCE_VALIDATION: ${{ needs.source-validation.result }}
          AUTOMATION_TESTS: ${{ needs.automation-tests.result }}
          MACOS_SHIPPING: ${{ needs.macos-shipping.result }}
        run: |
          set -euo pipefail
          status=0

          # source-validation is unconditional and carries the automation-evidence check.
          echo "SOURCE_VALIDATION = $SOURCE_VALIDATION"
          if [ "$SOURCE_VALIDATION" != "success" ]; then
            status=1
            echo "::error::source-validation did not succeed (result=$SOURCE_VALIDATION). It is unconditional, so this is a real failure."
          fi

          # A runner-gated job may be skipped, but must never be red.
          for job in AUTOMATION_TESTS MACOS_SHIPPING; do
            result="${!job}"
            echo "$job = $result"
            case "$result" in
              success) ;;
              skipped)
                echo "::notice::$job was skipped (no self-hosted UE5/macOS runner configured). Its claim is covered by Docs/automation-evidence.json, which source-validation verified against this tree."
                ;;
              *)
                status=1
                echo "::error::$job ran and did not succeed (result=$result)."
                ;;
            esac
          done

          exit "$status"
